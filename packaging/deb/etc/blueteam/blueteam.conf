# BlueTeam Linux Enterprise Configuration
# This file configures the BlueTeam security daemon

[daemon]
# Monitoring interval in seconds
monitoring_interval = 5

# Enable/disable monitoring modules
enable_network_monitoring = true
enable_process_monitoring = true
enable_file_monitoring = true
enable_resource_monitoring = true

# Threat detection sensitivity (0.0 - 1.0)
# Higher values = more sensitive
threat_sensitivity = 0.7

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

[network]
# Monitor network connections
enabled = true

# Alert on suspicious ports
suspicious_ports = 666,6666,31337,27374,27665,27666,27667

# Block suspicious connections
block_suspicious = false

# Track DNS queries
track_dns = true

[processes]
# Monitor process creation
enabled = true

# Alert on suspicious processes
suspicious_patterns = nc,ncat,netcat,curl,wget

# Monitor privilege escalation
monitor_sudo = true

# Alert on unauthorized sudo
alert_unauthorized_sudo = true

[files]
# Monitor critical files
enabled = true

# Critical files to monitor
critical_files = /etc/passwd,/etc/shadow,/etc/sudoers,/root/.ssh/authorized_keys,/var/log/auth.log

# Alert on modifications
alert_on_modify = true

[ml]
# Machine learning threat detection
enabled = true

# Model update interval (hours)
model_update_interval = 24

# Anomaly detection threshold (0.0 - 1.0)
anomaly_threshold = 0.7

[alerting]
# Alert destinations
enabled = true

# Syslog alerting
syslog_enabled = true
syslog_facility = LOG_LOCAL0

# Email alerting (optional)
email_enabled = false
email_to = security@example.com
email_from = blueteam@example.com

# Slack integration (optional)
slack_enabled = false
slack_webhook_url = 

# PagerDuty integration (optional)
pagerduty_enabled = false
pagerduty_key = 

[database]
# Data storage
data_dir = /var/lib/blueteam

# Retention period (days)
retention_days = 90

# Threat log rotation (MB)
threat_log_max_size = 100

[performance]
# CPU limit (percentage)
cpu_limit = 50

# Memory limit (MB)
memory_limit = 512

# Max threads
max_threads = 4
